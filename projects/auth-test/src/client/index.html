<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <script type="importmap">
            {
                "imports": {
                    "template-engine/": "./node_modules/@tobi2409/template-engine/src/"
                }
            }
        </script>

        <link
            rel="stylesheet"
            href="node_modules/@tobi2409/layout/src/layout.css"
        />
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div id="app"></div>

        <template id="app-template">
            <div class="login">
                <h3>Login</h3>
                <input
                    type="text"
                    placeholder="Username"
                    bind-input-value="loginSection.email"
                    class="username"
                />
                <input
                    type="text"
                    placeholder="Password"
                    bind-input-value="loginSection.password"
                    class="password"
                />
                <button action-click="loginSection.okClick" class="ok">
                    Login
                </button>
                <p style-color="loginSection.statusColor">
                    <get>loginSection.statusMessage</get>
                </p>
            </div>

            <div class="register">
                <h3>Register</h3>
                <input
                    type="text"
                    placeholder="Username"
                    bind-input-value="registerSection.email"
                    class="username"
                />
                <input
                    type="text"
                    placeholder="Password"
                    bind-input-value="registerSection.password"
                    class="password"
                />
                <button action-click="registerSection.okClick" class="ok">
                    Register
                </button>
                <p style-color="registerSection.statusColor">
                    <get>registerSection.statusMessage</get>
                </p>
                <p>You have to activate the account in database</p>
            </div>

            <div class="get-current-user">
                <h3>Token after Login:</h3>
                <input
                    type="text"
                    placeholder="Token"
                    bind-input-value="currentUserSection.token"
                    class="token"
                />
                <button action-click="currentUserSection.okClick" class="ok">
                    Get Current User
                </button>
                <p style-color="currentUserSection.statusColor">
                    Current User UUID:
                    <get>currentUserSection.statusMessage</get>
                </p>
            </div>
        </template>

        <template-use
            id="app-template-use"
            template-id="app-template"
            mount-id="app"
        >
        </template-use>

        <script type="module" src="index.js"></script>
    </body>
</html>
